<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            #btn-click:
                position: fixed;
                top: 75%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 50px; height: 100px;  
        </style>
    </head>
    <body>
        <button id="btn-click" onclick="btnclick()">Click</button>
        <script>
            function btnclick() {
                alert("Button was clicked!");
            }
        </script>
    </body>
</html>
