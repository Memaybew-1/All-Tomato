<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Tomato - Trang chủ</title>
    <style>
        :root {
            --bg-color: #0c0c0c;
            --surface-color: #313131;
            --border-color: #565656;
            --text-dim: #7b7b7b;
            --text-normal: #a0a0a0;
            --text-light: #c5c5c5;
            --text-white: #eaeaea;
            --neon-glow: 0 0 8px rgba(234, 234, 234, 0.4);
            --neon-border: 0 0 10px rgba(86, 86, 86, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-normal);
            font-family: Arial, sans-serif;
            font-size: 13px;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .wiki-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            box-shadow: var(--neon-border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            position: relative;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
            text-align: left;
            animation: slideDown 0.6s ease forwards;
        }

        h1 {
            font-size: 20px;
            color: var(--text-white);
            font-weight: bold;
            text-shadow: var(--neon-glow);
            margin-bottom: 2px;
        }

        .subtitle {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .wiki-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .wiki-intro {
            font-size: 11px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .link-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .link-item {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .link-item:nth-child(1) { animation-delay: 0.2s; }
        .link-item:nth-child(2) { animation-delay: 0.3s; }
        .link-item:nth-child(3) { animation-delay: 0.4s; }
        .link-item:nth-child(4) { animation-delay: 0.5s; }

        a.wiki-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--surface-color);
            color: var(--text-white);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
            -webkit-tap-highlight-color: transparent;
        }

        a.wiki-link:hover, a.wiki-link:active {
            background-color: var(--border-color);
            color: var(--text-white);
            box-shadow: var(--neon-glow);
            transform: translateX(4px);
        }

        footer {
            border-top: 1px solid var(--border-color);
            margin-top: 16px;
            padding-top: 10px;
            text-align: center;
            font-size: 10px;
            color: var(--text-dim);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="wiki-container">
        <header>
            <h1>All Tomato</h1>
            <div class="subtitle">Trang chủ</div>
        </header>

        <div class="wiki-content">
            <p class="wiki-intro">Bách khoa toàn thư:</p>
            <ul class="link-list">
                <li class="link-item">
                    <a href="html/umia.html" class="wiki-link">Nhánh Umia<span>➔</span></a>
                </li>
                <li class="link-item">
                    <a href="html/yeia.html" class="wiki-link">Nhánh Yeia<span>➔</span></a>
                </li>
                <li class="link-item">
                    <a href="html/quynese.html" class="wiki-link">Nhánh Quynese<span>➔</span></a>
                </li>
                <li class="link-item">
                    <a href="html/robotoous" class="wiki-link">Nhánh Robotoous<span>➔</span></a>
                </li>
            </ul>
        </div>

        <footer>
            <span>Dữ liệu tham khảo trực tuyến</span>
        </footer>
    </div>

    <script>
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });
        
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
